<script>
const data = {
xuanzang:{t:"玄奘",m:"602–664｜唐代",b:`<p>唐代唯識學漢傳化的關鍵人物。赴印度求法，回國後主持大量佛典翻譯。</p><ul><li>代表譯典：《解深密經》《瑜伽師地論》《成唯識論》等相關典籍</li><li>建立以瑜伽行派文獻為核心的漢傳唯識學資源</li><li>其譯學成為後來法相宗與近代唯識復興的重要古典依據</li></ul>`},
kuiji:{t:"窺基",m:"632–682｜唐代",b:`<p>玄奘弟子，後世通常視為法相宗的重要系統化人物。</p><ul><li>整理與闡釋唯識教義</li><li>代表作包括《成唯識論述記》等</li><li>對後世研究五位、百法、三性等具有重要影響</li></ul>`},
yang:{t:"楊仁山",m:"1837–1911｜清末佛學復興",b:`<p>近代中國佛教復興的重要奠基者。其核心貢獻之一，是透過金陵刻經處大量刊刻佛典，重建近代佛學的文獻基礎。</p><ul><li>金陵刻經處</li><li>與日本佛教學者交流</li><li>促成失傳或罕見佛典重新流通</li><li>門下及相關學人後來成為民初佛學復興的重要力量</li></ul>`},

neixue:{t:"支那內學院",m:"南京｜1920年代起",b:`<p>近代中國佛學研究史上的重要學術中心。歐陽竟無主持，使唯識、因明與佛典研究形成較完整的學院化環境。</p><ul><li>重視印度佛學與原典</li><li>培養近代佛學研究人才</li><li>對呂澂等人的學術發展影響深遠</li></ul>`},
wuchang:{t:"武昌佛學院",m:"太虛｜1922",b:`<p>太虛推動的現代佛教教育機構。與支那內學院形成民初佛學發展中兩種不同而又互相對話的路線。</p><ul><li>重視僧教育與佛教現代化</li><li>兼攝多宗佛學</li><li>與太虛的人間佛教、佛教改革思想相連</li></ul>`},
lucheng:{t:"呂澂",m:"1896–1989｜現代佛教學術研究",b:`<p>近代中國佛教文獻學與唯識、因明研究的重要學者。</p><ul><li>重視梵、藏、漢佛典與思想史</li><li>重新考察印度瑜伽行派與漢傳唯識</li><li>使唯識研究逐步從宗派立場轉向文獻與歷史研究</li></ul>`},
meiguangxi:{t:"梅光羲",m:"1880–1947｜民國佛學",b:`<p>近代佛學教育與唯識研究的重要人物，與民國佛教學術網絡關係密切。</p><ul><li>推動唯識學講習</li><li>參與近代佛學教育與經論弘傳</li></ul>`},
classical:{t:"古典唯識",m:"玄奘—窺基系統",b:`<p>學習近現代唯識之前，先掌握古典唯識的基本框架。</p><ul><li><b>八識：</b>前五識、意識、末那識、阿賴耶識</li><li><b>三性：</b>遍計所執性、依他起性、圓成實性</li><li><b>三無性：</b>相無性、生無性、勝義無性</li><li><b>轉依：</b>從染污識的運作走向解脫智慧</li></ul>`},
taixu:{t:"太虛思想",m:"1890–1947｜佛教改革",b:`<p>太虛並非單純的唯識宗派復興者，而是試圖以現代教育、組織與思想改革重新建構中國佛教。</p><ul><li>武昌佛學院</li><li>佛教現代化</li><li>人間佛教思想的重要先驅</li><li>與歐陽竟無形成重要思想對話</li></ul>`},
newweishi:{t:"新唯識論",m:"熊十力｜20世紀中國哲學",b:`<p>「新唯識論」與玄奘—窺基的傳統法相唯識不可直接畫等號。熊十力受到佛學影響後，將唯識問題轉化為中國哲學的本體論與體用論問題。</p><ul><li>代表人物：熊十力</li><li>重要著作：《新唯識論》</li><li>關注體用、本體與現象等問題</li><li>後來與現代新儒家思想發展產生關聯</li></ul>`},
yinshun:{t:"印順思想",m:"1906–2005｜佛教思想史",b:`<p>印順重新考察印度佛教與中國佛教思想發展，並不把唯識視為理解大乘佛教的唯一道路。</p><ul><li>重視阿含、般若、中觀與大乘佛教史</li><li>重新定位唯識與如來藏等思想</li><li>與人間佛教的現代發展有重要關聯</li></ul>`},
xiong:{t:"熊十力",m:"1885–1968｜新唯識論",b:`<p>20世紀中國哲學的重要人物。早年受民國佛學影響，後形成具有中國哲學特色的「新唯識論」。</p><ul><li>《新唯識論》</li><li>將唯識問題轉為本體論、體用論問題</li><li>與傳統法相唯識存在明顯差異</li></ul>`},
yinshun2:{t:"印順",m:"1906–2005｜現代佛學",b:`<p>以佛教思想史與印度佛教研究為基礎，重新整理阿含、大乘、中觀、唯識與如來藏的歷史關係。</p>`},
modernstudy:{t:"當代唯識研究",m:"20世紀後期至今",b:`<p>當代研究逐漸從「復興某一宗派」轉向佛教學、文獻學、思想史與比較哲學。</p><ul><li>梵文、藏文、漢文材料互證</li><li>印度瑜伽行派思想史</li><li>唯識與中觀、如來藏比較</li><li>心識哲學、認識論、比較哲學</li></ul>`},
concepts:{t:"唯識學核心概念",m:"建議學習順序",b:`<p>建議按照「心識 → 種子 → 三性 → 三無性 → 轉依」逐步掌握。</p><ul><li>八識與阿賴耶識</li><li>末那識與我執</li><li>種子、熏習與現行</li><li>三性、三無性</li><li>轉識成智與解脫論</li></ul>`},
method:{t:"研究方法的轉型",m:"清末至今",b:`<p>近現代唯識復興本身也反映佛學研究方法的轉型。</p><ul><li>清末：經典刊刻與傳承恢復</li><li>民初：學院、講學與宗派論爭</li><li>20世紀：文獻學、思想史與哲學化</li><li>當代：跨語言文獻、歷史批判與比較哲學</li></ul>`}
};

const modal=document.getElementById("modal"), back=document.getElementById("backdrop");
function show(k){
 const d=data[k]; if(!d)return;
 document.getElementById("mtitle").textContent=d.t;
 document.getElementById("mmeta").textContent=d.m;
 document.getElementById("mbody").innerHTML=d.b;
 modal.style.display="block"; back.style.display="block";
}
document.querySelectorAll(".node").forEach(n=>n.addEventListener("click",()=>show(n.dataset.key)));
function close(){modal.style.display="none";back.style.display="none"}
document.getElementById("close").onclick=close; back.onclick=close;
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});

document.querySelectorAll(".toolbar button").forEach(btn=>{
 btn.addEventListener("click",()=>{
   document.querySelectorAll(".toolbar button").forEach(b=>b.classList.remove("active"));
   btn.classList.add("active");
   const f=btn.dataset.filter;
   document.querySelectorAll(".node").forEach(n=>{
     n.style.opacity=(f==="all"||n.dataset.type===f)?"1":"0.12";
   });
 });
});
</script>
</body>
</html>
