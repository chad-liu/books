<title>Git &amp; GitHub 指令速查</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --paper:#F5F6F8;
  --surface:#FFFFFF;
  --surface-2:#EEF0F3;
  --ink:#14171F;
  --ink-2:#565D6D;
  --ink-3:#8A90A0;
  --line:#DFE2E8;
  --line-soft:#EAECF0;
  --accent:#2B5F5A;
  --accent-ink:#FFFFFF;
  --accent-soft:#DEEAE7;
  --amber:#93650F;
  --amber-soft:#F3E6C9;
  --add:#1E7A4C;
  --add-soft:#E1F1E7;
  --del:#B0392F;
  --del-soft:#FBE6E3;
  --code-bg:#11131A;
  --code-ink:#E8EAF0;
  --code-line:#2A2E3A;
  --shadow: 0 1px 2px rgba(20,23,31,.04), 0 8px 24px -12px rgba(20,23,31,.12);
  color-scheme: light;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1015;
    --surface:#161922;
    --surface-2:#1D212C;
    --ink:#EDEFF4;
    --ink-2:#A6ACBC;
    --ink-3:#6E7486;
    --line:#2B2F3B;
    --line-soft:#232733;
    --accent:#6FBFB2;
    --accent-ink:#0E1015;
    --accent-soft:#1B3330;
    --amber:#E0B255;
    --amber-soft:#3A2F17;
    --add:#5FC78C;
    --add-soft:#16281E;
    --del:#E88376;
    --del-soft:#2E1917;
    --code-bg:#0A0B10;
    --code-ink:#E8EAF0;
    --code-line:#252938;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1015;
  --surface:#161922;
  --surface-2:#1D212C;
  --ink:#EDEFF4;
  --ink-2:#A6ACBC;
  --ink-3:#6E7486;
  --line:#2B2F3B;
  --line-soft:#232733;
  --accent:#6FBFB2;
  --accent-ink:#0E1015;
  --accent-soft:#1B3330;
  --amber:#E0B255;
  --amber-soft:#3A2F17;
  --add:#5FC78C;
  --add-soft:#16281E;
  --del:#E88376;
  --del-soft:#2E1917;
  --code-bg:#0A0B10;
  --code-ink:#E8EAF0;
  --code-line:#252938;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
  color-scheme: dark;
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"IBM Plex Sans TC","IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
code, .mono{
  font-family:"IBM Plex Mono","SFMono-Regular",Consolas,Menlo,monospace;
}

/* ---------- header ---------- */
header.top{
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter:blur(10px) saturate(1.1);
  border-bottom:1px solid var(--line);
}
.top-inner{
  max-width:1080px; margin:0 auto;
  padding:18px 24px 16px;
}
.brand-row{
  display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
  justify-content:space-between;
}
.brand{
  display:flex; align-items:baseline; gap:10px;
}
.brand h1{
  font-size:1.28rem; margin:0; font-weight:700; letter-spacing:-.01em;
  text-wrap:balance;
}
.brand .glyph{
  font-family:"IBM Plex Mono"; font-weight:600; font-size:.95rem;
  color:var(--accent-ink); background:var(--accent);
  padding:3px 8px; border-radius:6px; letter-spacing:.02em;
}
.brand-sub{
  font-size:.82rem; color:var(--ink-2); margin:2px 0 0;
}
.stat-line{
  font-size:.78rem; color:var(--ink-3); font-family:"IBM Plex Mono";
  white-space:nowrap;
}

.controls{
  max-width:1080px; margin:0 auto; padding:0 24px 16px;
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
}
.search-wrap{
  position:relative; flex:1 1 260px; min-width:220px;
}
.search-wrap svg{
  position:absolute; left:12px; top:50%; transform:translateY(-50%);
  width:15px; height:15px; color:var(--ink-3); pointer-events:none;
}
#search{
  width:100%; padding:9px 12px 9px 34px;
  border-radius:9px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink);
  font-size:.88rem; font-family:inherit;
  outline:none;
}
#search::placeholder{color:var(--ink-3);}
#search:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}

.chip-nav{
  display:flex; gap:6px; flex-wrap:wrap;
}
.chip{
  font-size:.76rem; font-weight:500;
  padding:6px 11px; border-radius:999px;
  border:1px solid var(--line);
  background:var(--surface); color:var(--ink-2);
  cursor:pointer; white-space:nowrap;
  transition:background .12s, color .12s, border-color .12s;
}
.chip:hover{border-color:var(--accent); color:var(--ink);}
.chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

/* ---------- layout ---------- */
main{
  max-width:1080px; margin:0 auto; padding:28px 24px 80px;
  display:grid; gap:22px;
  grid-template-columns:repeat(auto-fit, minmax(460px,1fr));
  align-items:start;
}
section.cat{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:var(--shadow);
  overflow:hidden;
  scroll-margin-top:132px;
}
.cat-head{
  display:flex; align-items:center; gap:10px;
  padding:15px 18px;
  border-bottom:1px solid var(--line-soft);
  background:var(--surface-2);
}
.cat-dot{
  width:8px; height:8px; border-radius:50%;
  background:var(--accent); flex:none;
}
.cat-head h2{
  font-size:.98rem; margin:0; font-weight:600; letter-spacing:-.01em;
}
.cat-head .en{
  font-size:.72rem; color:var(--ink-3); font-family:"IBM Plex Mono";
  margin-left:auto;
}

.cmd-list{
  display:flex; flex-direction:column;
}
.cmd-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:2px 12px;
  padding:11px 18px;
  border-bottom:1px solid var(--line-soft);
  align-items:start;
}
.cmd-row:last-child{border-bottom:none;}
.cmd-row:hover{background:var(--surface-2);}

.cmd-code{
  display:flex; align-items:center; gap:8px; min-width:0;
}
.cmd-code code{
  font-size:.83rem;
  background:var(--code-bg); color:var(--code-ink);
  border:1px solid var(--code-line);
  padding:3px 8px; border-radius:6px;
  white-space:nowrap; overflow-x:auto;
  max-width:100%;
}
.cmd-code code .ph{ color:#8DA0FF; }
.cmd-desc{
  grid-column:1 / -1;
  font-size:.82rem; color:var(--ink-2);
  margin:0;
}
.copy-btn{
  flex:none;
  width:24px; height:24px; border-radius:6px;
  border:1px solid transparent; background:transparent;
  color:var(--ink-3); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:background .12s, color .12s;
}
.copy-btn:hover{background:var(--surface-2); color:var(--accent); border-color:var(--line);}
.copy-btn svg{width:13px; height:13px;}
.copy-btn.copied{color:var(--add); background:var(--add-soft); border-color:var(--add);}

.tag{
  font-size:.68rem; font-weight:600; font-family:"IBM Plex Mono";
  padding:1px 6px; border-radius:5px; flex:none;
  letter-spacing:.01em;
}
.tag.danger{background:var(--del-soft); color:var(--del);}
.tag.warn{background:var(--amber-soft); color:var(--amber);}

/* diff-flavored example block used once, in Basics */
.diff-mini{
  margin:0 18px 14px; border-radius:8px; overflow:hidden;
  border:1px solid var(--code-line); font-size:.78rem;
}
.diff-mini div{padding:3px 10px; font-family:"IBM Plex Mono"; background:var(--code-bg); color:var(--code-ink);}
.diff-mini .add{background:color-mix(in srgb, var(--add) 18%, var(--code-bg)); color:var(--add);}
.diff-mini .del{background:color-mix(in srgb, var(--del) 18%, var(--code-bg)); color:var(--del);}

.empty-state{
  display:none;
  max-width:1080px; margin:60px auto; padding:0 24px;
  text-align:center; color:var(--ink-3); font-size:.9rem;
}

footer{
  max-width:1080px; margin:0 auto; padding:0 24px 48px;
  color:var(--ink-3); font-size:.76rem; text-align:center;
}
footer .k{
  font-family:"IBM Plex Mono"; background:var(--surface-2);
  border:1px solid var(--line); padding:1px 6px; border-radius:5px;
}

@media (max-width:640px){
  main{grid-template-columns:1fr;}
  .cmd-row{grid-template-columns:1fr;}
  .cmd-code code{white-space:normal; word-break:break-all;}
}
</style>

<header class="top">
  <div class="top-inner">
    <div class="brand-row">
      <div class="brand">
        <span class="glyph">$_</span>
        <div>
          <h1>Git &amp; GitHub 指令速查</h1>
          <p class="brand-sub">常用 <code class="mono">git</code> 與 <code class="mono">gh</code>（GitHub CLI）指令整理，依工作流程分類</p>

      <span class="stat-line" id="stat-line">53 條指令 · 7 個分類</span>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <input id="search" type="text" placeholder="搜尋指令或關鍵字，如 rebase、push、pr…" autocomplete="off">

<main id="main"></main>

<p class="empty-state" id="empty-state">沒有符合「<span id="empty-term"></span>」的指令。</p>

<footer>
  按一下指令旁的圖示可複製到剪貼簿 · <span class="k">&lt;branch&gt;</span> 之類的內容代表要替換成你自己的值
</footer>

<script>
function renderCmd(cmd){
  const esc = cmd.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc.replace(/(&lt;[^&]+?&gt;)/g, '<span class="ph">$1</span>');
}

const DATA = [
  {
    id:'setup', zh:'設定與初始化', en:'Setup & Init',
    items:[
      {cmd:'git init', desc:'在目前資料夾建立一個新的 Git 儲存庫'},
      {cmd:'git clone <url>', desc:'將遠端儲存庫完整複製到本機'},
      {cmd:'git config --global user.name "<name>"', desc:'設定全域使用者名稱，會顯示在每次提交紀錄中'},
      {cmd:'git config --global user.email "<email>"', desc:'設定全域電子郵件，需與 GitHub 帳號信箱一致才會正確歸戶'},
      {cmd:'gh auth login', desc:'登入 GitHub CLI，之後即可直接在終端機操作 PR、issue 等'},
      {cmd:'gh repo create <name>', desc:'建立新的 GitHub 儲存庫，可加 --public / --private / --clone'},
    ]
  },
  {
    id:'basics', zh:'基本操作', en:'Basics',
    items:[
      {cmd:'git status', desc:'查看目前工作區與暫存區的變更狀態'},
      {cmd:'git add <file>', desc:'將指定檔案加入暫存區，準備提交'},
      {cmd:'git add .', desc:'將目前資料夾內所有變更加入暫存區'},
      {cmd:'git commit -m "<message>"', desc:'將暫存區的變更提交為一筆新的版本紀錄'},
      {cmd:'git commit -am "<message>"', desc:'跳過 add，直接提交所有已追蹤檔案的變更'},
      {cmd:'git log --oneline --graph --all', desc:'以精簡的分支圖顯示所有分支的提交歷史'},
      {cmd:'git diff', desc:'比較工作區與最後一次提交之間尚未暫存的差異'},
      {cmd:'git diff --staged', desc:'比較暫存區與最後一次提交之間的差異'},
    ]
  },
  {
    id:'branch', zh:'分支操作', en:'Branching',
    items:[
      {cmd:'git branch', desc:'列出所有本機分支，目前所在分支會標星號'},
      {cmd:'git switch -c <branch>', desc:'建立新分支並立即切換過去（等同 checkout -b）'},
      {cmd:'git switch <branch>', desc:'切換到已存在的分支'},
      {cmd:'git branch -d <branch>', desc:'刪除已合併的本機分支', tag:{text:'需已合併',type:'warn'}},
      {cmd:'git branch -D <branch>', desc:'強制刪除分支，即使尚未合併', tag:{text:'不可逆',type:'danger'}},
      {cmd:'git merge <branch>', desc:'將指定分支的變更合併進目前分支'},
      {cmd:'git rebase <branch>', desc:'將目前分支的提交重新接在指定分支之後，歷史更線性'},
    ]
  },
  {
    id:'remote', zh:'遠端與同步', en:'Remote & Sync',
    items:[
      {cmd:'git remote -v', desc:'列出所有已設定的遠端儲存庫網址'},
      {cmd:'git remote add origin <url>', desc:'為本機儲存庫加入一個名為 origin 的遠端來源'},
      {cmd:'git fetch', desc:'從遠端下載最新資料，但不自動合併進目前分支'},
      {cmd:'git pull', desc:'等同 fetch + merge，抓取並合併遠端最新變更'},
      {cmd:'git pull --rebase', desc:'抓取遠端變更後以 rebase 方式接續，避免多餘合併提交'},
      {cmd:'git push', desc:'將本機提交推送到已連結的遠端分支'},
      {cmd:'git push -u origin <branch>', desc:'推送並設定追蹤關係，之後可直接用 git push'},
      {cmd:'git push origin --delete <branch>', desc:'刪除遠端上的指定分支', tag:{text:'不可逆',type:'danger'}},
    ]
  },
  {
    id:'undo', zh:'復原與修正', en:'Undo & Fix',
    items:[
      {cmd:'git restore <file>', desc:'放棄工作區中尚未暫存的變更，還原成最後提交狀態'},
      {cmd:'git restore --staged <file>', desc:'將檔案從暫存區移出，變更仍保留在工作區'},
      {cmd:'git reset --soft HEAD~1', desc:'復原最後一次提交，變更保留在暫存區'},
      {cmd:'git reset --hard HEAD~1', desc:'徹底移除最後一次提交及其所有變更', tag:{text:'不可逆',type:'danger'}},
      {cmd:'git revert <commit>', desc:'新增一筆提交來抵銷指定提交的變更，安全且保留歷史'},
      {cmd:'git commit --amend', desc:'修改最後一次提交的內容或訊息'},
      {cmd:'git stash', desc:'暫時保存目前未完成的變更，讓工作區恢復乾淨'},
      {cmd:'git stash pop', desc:'取回最近一次 stash 的變更並套用回工作區'},
    ]
  },
  {
    id:'gh', zh:'協作與 PR', en:'GitHub CLI',
    items:[
      {cmd:'gh pr create', desc:'從目前分支建立一個新的 Pull Request'},
      {cmd:'gh pr list', desc:'列出這個儲存庫目前開啟中的所有 PR'},
      {cmd:'gh pr checkout <number>', desc:'將指定編號的 PR 切換到本機分支以便測試或review'},
      {cmd:'gh pr view <number> --web', desc:'在瀏覽器中開啟指定 PR 的網頁'},
      {cmd:'gh pr merge <number>', desc:'合併指定的 Pull Request，可加 --squash / --rebase'},
      {cmd:'gh issue create', desc:'建立一則新的 Issue'},
      {cmd:'gh issue list', desc:'列出這個儲存庫目前的所有 Issue'},
      {cmd:'gh repo view --web', desc:'在瀏覽器中開啟目前儲存庫的 GitHub 頁面'},
    ]
  },
  {
    id:'advanced', zh:'進階操作', en:'Advanced',
    items:[
      {cmd:'git cherry-pick <commit>', desc:'將其他分支的單一提交套用到目前分支'},
      {cmd:'git rebase -i HEAD~<n>', desc:'互動式 rebase，可合併、重排或編輯最近 n 筆提交'},
      {cmd:'git tag <name>', desc:'為目前提交建立一個標籤，常用於標記版本號'},
      {cmd:'git push --tags', desc:'將本機所有標籤推送到遠端儲存庫'},
      {cmd:'git blame <file>', desc:'逐行顯示檔案每一行最後是由誰、哪次提交修改'},
      {cmd:'git bisect start', desc:'以二分搜尋法在提交歷史中找出引入問題的那一筆'},
      {cmd:'git log --grep="<keyword>"', desc:'依提交訊息關鍵字搜尋歷史紀錄'},
      {cmd:'git reflog', desc:'顯示 HEAD 移動紀錄，救回看似遺失的提交的最後手段'},
    ]
  },
];

const main = document.getElementById('main');
const chipNav = document.getElementById('chip-nav');
const searchInput = document.getElementById('search');
const emptyState = document.getElementById('empty-state');
const emptyTerm = document.getElementById('empty-term');
const statLine = document.getElementById('stat-line');

let totalCount = 0;

DATA.forEach(cat=>{
  totalCount += cat.items.length;

  const chip = document.createElement('button');
  chip.className = 'chip';
  chip.textContent = cat.zh;
  chip.addEventListener('click', ()=>{
    document.getElementById('cat-'+cat.id).scrollIntoView({behavior:'smooth', block:'start'});
  });
  chipNav.appendChild(chip);

  const section = document.createElement('section');
  section.className = 'cat';
  section.id = 'cat-'+cat.id;
  section.dataset.catId = cat.id;

  const head = document.createElement('div');
  head.className = 'cat-head';
  head.innerHTML = `<span class="cat-dot"></span><h2>${cat.zh}</h2><span class="en">${cat.en}</span>`;
  section.appendChild(head);

  const list = document.createElement('div');
  list.className = 'cmd-list';

  cat.items.forEach(item=>{
    const row = document.createElement('div');
    row.className = 'cmd-row';
    row.dataset.search = (item.cmd + ' ' + item.desc).toLowerCase();

    const codeWrap = document.createElement('div');
    codeWrap.className = 'cmd-code';
    codeWrap.innerHTML = `<code>${renderCmd(item.cmd)}</code>` + (item.tag ? `<span class="tag ${item.tag.type}">${item.tag.text}</span>` : '');

    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.title = '複製指令';
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
    btn.addEventListener('click', async ()=>{
      try{
        await navigator.clipboard.writeText(item.cmd);
        btn.classList.add('copied');
        setTimeout(()=>btn.classList.remove('copied'), 1200);
      }catch(e){ /* clipboard unavailable — silently ignore */ }
    });
    codeWrap.appendChild(btn);

    const desc = document.createElement('p');
    desc.className = 'cmd-desc';
    desc.textContent = item.desc;

    row.appendChild(codeWrap);
    row.appendChild(desc);
    list.appendChild(row);
  });

  section.appendChild(list);
  main.appendChild(section);
});

statLine.textContent = totalCount + ' 條指令 · ' + DATA.length + ' 個分類';

searchInput.addEventListener('input', ()=>{
  const term = searchInput.value.trim().toLowerCase();
  let visibleTotal = 0;
  document.querySelectorAll('section.cat').forEach(section=>{
    let visibleInSection = 0;
    section.querySelectorAll('.cmd-row').forEach(row=>{
      const match = !term || row.dataset.search.includes(term);
      row.style.display = match ? '' : 'none';
      if(match) visibleInSection++;
    });
    section.style.display = visibleInSection ? '' : 'none';
    visibleTotal += visibleInSection;
  });
  emptyState.style.display = (term && visibleTotal===0) ? 'block' : 'none';
  emptyTerm.textContent = searchInput.value.trim();
});
</script>
