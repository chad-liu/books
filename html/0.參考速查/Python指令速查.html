*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"IBM Plex Sans TC","IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
code, .mono{
  font-family:"IBM Plex Mono","SFMono-Regular",Consolas,Menlo,monospace;
}

/* ---------- header ---------- */
header.top{
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter:blur(10px) saturate(1.1);
  border-bottom:1px solid var(--line);
}
.top-inner{
  max-width:1080px; margin:0 auto;
  padding:18px 24px 16px;
}
.brand-row{
  display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
  justify-content:space-between;
}
.brand{
  display:flex; align-items:baseline; gap:10px;
}
.brand h1{
  font-size:1.28rem; margin:0; font-weight:700; letter-spacing:-.01em;
  text-wrap:balance;
}
.brand .glyph{
  font-family:"IBM Plex Mono"; font-weight:600; font-size:.95rem;
  color:var(--accent-ink); background:var(--accent);
  padding:3px 8px; border-radius:6px; letter-spacing:.02em;
}
.brand-sub{
  font-size:.82rem; color:var(--ink-2); margin:2px 0 0;
}
.stat-line{
  font-size:.78rem; color:var(--ink-3); font-family:"IBM Plex Mono";
  white-space:nowrap;
}

.controls{
  max-width:1080px; margin:0 auto; padding:0 24px 16px;
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
}
.search-wrap{
  position:relative; flex:1 1 260px; min-width:220px;
}
.search-wrap svg{
  position:absolute; left:12px; top:50%; transform:translateY(-50%);
  width:15px; height:15px; color:var(--ink-3); pointer-events:none;
}
#search{
  width:100%; padding:9px 12px 9px 34px;
  border-radius:9px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink);
  font-size:.88rem; font-family:inherit;
  outline:none;
}
#search::placeholder{color:var(--ink-3);}
#search:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}

.chip-nav{
  display:flex; gap:6px; flex-wrap:wrap;
}
.chip{
  font-size:.76rem; font-weight:500;
  padding:6px 11px; border-radius:999px;
  border:1px solid var(--line);
  background:var(--surface); color:var(--ink-2);
  cursor:pointer; white-space:nowrap;
  transition:background .12s, color .12s, border-color .12s;
  font-family:inherit;
}
.chip:hover{border-color:var(--accent); color:var(--ink);}
.chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

/* ---------- layout ---------- */
main{
  max-width:1160px; margin:0 auto; padding:28px 24px 80px;
  display:grid; gap:22px;
  grid-template-columns:repeat(auto-fit, minmax(480px,1fr));
  align-items:start;
}
section.cat{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:var(--shadow);
  overflow:hidden;
  scroll-margin-top:132px;
}
.cat-head{
  display:flex; align-items:center; gap:10px;
  padding:15px 18px;
  border-bottom:1px solid var(--line-soft);
  background:var(--surface-2);
}
.cat-dot{
  width:8px; height:8px; border-radius:50%;
  background:var(--accent); flex:none;
}
.cat-head h2{
  font-size:.98rem; margin:0; font-weight:600; letter-spacing:-.01em;
}
.cat-head .en{
  font-size:.72rem; color:var(--ink-3); font-family:"IBM Plex Mono";
  margin-left:auto;
}

.snip-list{
  display:flex; flex-direction:column;
}
.snip-row{
  padding:13px 18px;
  border-bottom:1px solid var(--line-soft);
}
.snip-row:last-child{border-bottom:none;}
.snip-row:hover{background:var(--surface-2);}

.snip-code{
  position:relative;
  margin-bottom:7px;
}
.snip-code pre{
  margin:0;
  background:var(--code-bg); color:var(--code-ink);
  border:1px solid var(--code-line);
  border-radius:8px;
  padding:10px 34px 10px 12px;
  font-family:"IBM Plex Mono","SFMono-Regular",Consolas,Menlo,monospace;
  font-size:.79rem; line-height:1.55;
  white-space:pre; overflow-x:auto;
}
.snip-code .kw{ color:#C792EA; font-weight:600; }
.snip-code .str{ color:#C3E88D; }
.snip-code .bt{ color:#82AAFF; }
.snip-code .num{ color:#F78C6C; }
.snip-code .cm{ color:var(--code-ink-2); font-style:italic; }

.copy-btn{
  position:absolute; top:8px; right:8px;
  flex:none;
  width:24px; height:24px; border-radius:6px;
  border:1px solid var(--code-line); background:transparent;
  color:var(--code-ink-2); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:background .12s, color .12s;
}
.copy-btn:hover{background:#1a2030; color:var(--code-ink); border-color:var(--code-ink-2);}
.copy-btn svg{width:13px; height:13px;}
.copy-btn.copied{color:var(--add); background:var(--add-soft); border-color:var(--add);}

.snip-desc{
  font-size:.82rem; color:var(--ink-2);
  margin:0;
}

.tag{
  font-size:.68rem; font-weight:600; font-family:"IBM Plex Mono";
  padding:1px 6px; border-radius:5px; flex:none;
  letter-spacing:.01em;
}
.tag.danger{background:var(--del-soft); color:var(--del);}
.tag.warn{background:var(--amber-soft); color:var(--amber);}

.empty-state{
  display:none;
  max-width:1160px; margin:60px auto; padding:0 24px;
  text-align:center; color:var(--ink-3); font-size:.9rem;
}

footer{
  max-width:1160px; margin:0 auto; padding:0 24px 48px;
  color:var(--ink-3); font-size:.76rem; text-align:center;
}
footer .k{
  font-family:"IBM Plex Mono"; background:var(--surface-2);
  border:1px solid var(--line); padding:1px 6px; border-radius:5px;
}

@media (max-width:640px){
  main{grid-template-columns:1fr;}
  .snip-code pre{white-space:pre-wrap; word-break:break-word;}
}

<script>
function escHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

const KEYWORDS = 'def|class|return|if|elif|else|for|while|in|is|not|and|or|import|from|as|try|except|finally|raise|with|lambda|yield|pass|break|continue|global|nonlocal|del|assert|async|await|match|case';
const BUILTIN_TYPES = 'None|True|False|self|int|str|float|bool|list|dict|tuple|set|frozenset|bytes|type|object|Exception|len|range|print|input|open|enumerate|zip|map|filter|sorted|reversed|isinstance|super|staticmethod|classmethod|property';

function hl(raw){
  const esc = escHtml(raw);
  const master = new RegExp(
    '(#[^\\n]*)' +                                         // 1: comment
    "|('(?:[^'\\\\]|\\\\.)*'|\"(?:[^\"\\\\]|\\\\.)*\")" +   // 2: string
    '|\\b(' + KEYWORDS + ')\\b' +                          // 3: keyword
    '|\\b(' + BUILTIN_TYPES + ')\\b' +                     // 4: builtin
    '|\\b(\\d+(?:\\.\\d+)?)\\b',                           // 5: number
    'g'
  );
  return esc.replace(master, (m, cm, str, kw, bt, num) => {
    if (cm) return '<span class="cm">' + cm + '</span>';
    if (str) return '<span class="str">' + str + '</span>';
    if (kw) return '<span class="kw">' + kw + '</span>';
    if (bt) return '<span class="bt">' + bt + '</span>';
    if (num) return '<span class="num">' + num + '</span>';
    return m;
  });
}

const main = document.getElementById('main');
const chipNav = document.getElementById('chip-nav');
const searchInput = document.getElementById('search');
const emptyState = document.getElementById('empty-state');
const emptyTerm = document.getElementById('empty-term');
const statLine = document.getElementById('stat-line');

let totalCount = 0;

DATA.forEach(cat=>{
  totalCount += cat.items.length;

  const chip = document.createElement('button');
  chip.className = 'chip';
  chip.textContent = cat.zh;
  chip.addEventListener('click', ()=>{
    document.getElementById('cat-'+cat.id).scrollIntoView({behavior:'smooth', block:'start'});
  });
  chipNav.appendChild(chip);

  const section = document.createElement('section');
  section.className = 'cat';
  section.id = 'cat-'+cat.id;
  section.dataset.catId = cat.id;

  const head = document.createElement('div');
  head.className = 'cat-head';
  head.innerHTML = `<span class="cat-dot"></span><h2>${cat.zh}</h2><span class="en">${cat.en}</span>`;
  section.appendChild(head);

  const list = document.createElement('div');
  list.className = 'snip-list';

  cat.items.forEach(item=>{
    const row = document.createElement('div');
    row.className = 'snip-row';
    row.dataset.search = (item.code + ' ' + item.desc).toLowerCase();

    const codeWrap = document.createElement('div');
    codeWrap.className = 'snip-code';
    codeWrap.innerHTML = `<pre>${hl(item.code)}</pre>` +
      `<button class="copy-btn" title="複製程式碼"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>`;
    const btn = codeWrap.querySelector('.copy-btn');
    btn.addEventListener('click', async ()=>{
      try{
        await navigator.clipboard.writeText(item.code);
        btn.classList.add('copied');
        setTimeout(()=>btn.classList.remove('copied'), 1200);
      }catch(e){ /* clipboard unavailable — silently ignore */ }
    });

    const desc = document.createElement('p');
    desc.className = 'snip-desc';
    desc.textContent = item.desc + (item.tag ? '' : '');
    if(item.tag){
      const tagSpan = document.createElement('span');
      tagSpan.className = 'tag ' + item.tag.type;
      tagSpan.textContent = item.tag.text;
      tagSpan.style.marginLeft = '8px';
      desc.appendChild(tagSpan);
    }

    row.appendChild(codeWrap);
    row.appendChild(desc);
    list.appendChild(row);
  });

  section.appendChild(list);
  main.appendChild(section);
});

statLine.textContent = totalCount + ' 條語法 · ' + DATA.length + ' 個分類';

searchInput.addEventListener('input', ()=>{
  const term = searchInput.value.trim().toLowerCase();
  let visibleTotal = 0;
  document.querySelectorAll('section.cat').forEach(section=>{
    let visibleInSection = 0;
    section.querySelectorAll('.snip-row').forEach(row=>{
      const match = !term || row.dataset.search.includes(term);
      row.style.display = match ? '' : 'none';
      if(match) visibleInSection++;
    });
    section.style.display = visibleInSection ? '' : 'none';
    visibleTotal += visibleInSection;
  });
  emptyState.style.display = (term && visibleTotal===0) ? 'block' : 'none';
  emptyTerm.textContent = searchInput.value.trim();
});
</script>
