<style>

:root{
  --paper:#F2F4F8;
  --surface:#FFFFFF;
  --surface-2:#EAEEF4;
  --ink:#151A24;
  --ink-2:#57606F;
  --ink-3:#8991A3;
  --line:#DCE1EA;
  --line-soft:#E8ECF2;
  --accent:#2E5FA3;
  --accent-ink:#FFFFFF;
  --accent-soft:#E1EAF7;
  --amber:#93650F;
  --amber-soft:#F3E6C9;
  --add:#1E7A4C;
  --add-soft:#E1F1E7;
  --del:#B0392F;
  --del-soft:#FBE6E3;
  --code-bg:#0F1420;
  --code-ink:#E5E9F2;
  --code-ink-2:#8791A8;
  --code-line:#232B3D;
  --shadow: 0 1px 2px rgba(20,23,31,.04), 0 8px 24px -12px rgba(20,23,31,.12);

}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1017;
    --surface:#161A24;
    --surface-2:#1D222E;
    --ink:#EBEEF4;
    --ink-2:#A4ACBE;
    --ink-3:#6B7386;
    --line:#2A2F3E;
    --line-soft:#232837;
    --accent:#7FB0E8;
    --accent-ink:#0D1017;
    --accent-soft:#1B2D45;
    --amber:#E0B255;
    --amber-soft:#3A2F17;
    --add:#5FC78C;
    --add-soft:#16281E;
    --del:#E88376;
    --del-soft:#2E1917;
    --code-bg:#090C13;
    --code-ink:#E5E9F2;
    --code-ink-2:#818997;
    --code-line:#212637;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1017;
  --surface:#161A24;
  --surface-2:#1D222E;
  --ink:#EBEEF4;
  --ink-2:#A4ACBE;
  --ink-3:#6B7386;
  --line:#2A2F3E;

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"IBM Plex Sans TC","IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
code, .mono{
  font-family:"IBM Plex Mono","SFMono-Regular",Consolas,Menlo,monospace;
}

/* ---------- header ---------- */
header.top{
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter:blur(10px) saturate(1.1);
  border-bottom:1px solid var(--line);
}
.top-inner{
  max-width:1080px; margin:0 auto;
  padding:18px 24px 16px;
}
.brand-row{
  display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
  justify-content:space-between;
}
.brand{
  display:flex; align-items:baseline; gap:10px;
}
.brand h1{
  font-size:1.28rem; margin:0; font-weight:700; letter-spacing:-.01em;
  text-wrap:balance;
}
.brand .glyph{
  font-family:"IBM Plex Mono"; font-weight:600; font-size:.95rem;
  color:var(--accent-ink); background:var(--accent);
  padding:3px 8px; border-radius:6px; letter-spacing:.02em;
}
.brand-sub{
  font-size:.82rem; color:var(--ink-2); margin:2px 0 0;
}
.stat-line{
  font-size:.78rem; color:var(--ink-3); font-family:"IBM Plex Mono";
  white-space:nowrap;
}

.controls{
  max-width:1080px; margin:0 auto; padding:0 24px 16px;
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
}
.search-wrap{
  position:relative; flex:1 1 260px; min-width:220px;
}
.search-wrap svg{
  position:absolute; left:12px; top:50%; transform:translateY(-50%);
  width:15px; height:15px; color:var(--ink-3); pointer-events:none;
}
#search{
  width:100%; padding:9px 12px 9px 34px;
  border-radius:9px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink);
  font-size:.88rem; font-family:inherit;
  outline:none;
}
#search::placeholder{color:var(--ink-3);}
#search:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}

.chip-nav{
  display:flex; gap:6px; flex-wrap:wrap;
}
.chip{
  font-size:.76rem; font-weight:500;
  padding:6px 11px; border-radius:999px;
  border:1px solid var(--line);
  background:var(--surface); color:var(--ink-2);
  cursor:pointer; white-space:nowrap;
  transition:background .12s, color .12s, border-color .12s;
  font-family:inherit;
}
.chip:hover{border-color:var(--accent); color:var(--ink);}
.chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

/* ---------- layout ---------- */
main{
  max-width:1160px; margin:0 auto; padding:28px 24px 80px;
  display:grid; gap:22px;
  grid-template-columns:repeat(auto-fit, minmax(480px,1fr));
  align-items:start;
}
section.cat{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:var(--shadow);
  overflow:hidden;
  scroll-margin-top:132px;
}
.cat-head{
  display:flex; align-items:center; gap:10px;
  padding:15px 18px;
  border-bottom:1px solid var(--line-soft);
  background:var(--surface-2);
}
.cat-dot{
  width:8px; height:8px; border-radius:50%;
  background:var(--accent); flex:none;
}
.cat-head h2{
  font-size:.98rem; margin:0; font-weight:600; letter-spacing:-.01em;
}
.cat-head .en{
  font-size:.72rem; color:var(--ink-3); font-family:"IBM Plex Mono";
  margin-left:auto;
}

.snip-list{
  display:flex; flex-direction:column;
}
.snip-row{
  padding:13px 18px;
  border-bottom:1px solid var(--line-soft);
}
.snip-row:last-child{border-bottom:none;}
.snip-row:hover{background:var(--surface-2);}

.snip-code{
  position:relative;
  margin-bottom:7px;
}
.snip-code pre{
  margin:0;
  background:var(--code-bg); color:var(--code-ink);
  border:1px solid var(--code-line);
  border-radius:8px;
  padding:10px 34px 10px 12px;
  font-family:"IBM Plex Mono","SFMono-Regular",Consolas,Menlo,monospace;
  font-size:.79rem; line-height:1.55;
  white-space:pre; overflow-x:auto;
}
.snip-code .kw{ color:#C792EA; font-weight:600; }
.snip-code .str{ color:#C3E88D; }
.snip-code .bt{ color:#82AAFF; }
.snip-code .num{ color:#F78C6C; }
.snip-code .cm{ color:var(--code-ink-2); font-style:italic; }

.copy-btn{
  position:absolute; top:8px; right:8px;
  flex:none;
  width:24px; height:24px; border-radius:6px;
  border:1px solid var(--code-line); background:transparent;
  color:var(--code-ink-2); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:background .12s, color .12s;
}
.copy-btn:hover{background:#1a2030; color:var(--code-ink); border-color:var(--code-ink-2);}
.copy-btn svg{width:13px; height:13px;}
.copy-btn.copied{color:var(--add); background:var(--add-soft); border-color:var(--add);}

.snip-desc{
  font-size:.82rem; color:var(--ink-2);
  margin:0;
}

.tag{
  font-size:.68rem; font-weight:600; font-family:"IBM Plex Mono";
  padding:1px 6px; border-radius:5px; flex:none;
  letter-spacing:.01em;
}
.tag.danger{background:var(--del-soft); color:var(--del);}
.tag.warn{background:var(--amber-soft); color:var(--amber);}

.empty-state{
  display:none;
  max-width:1160px; margin:60px auto; padding:0 24px;
  text-align:center; color:var(--ink-3); font-size:.9rem;
}

footer{
  max-width:1160px; margin:0 auto; padding:0 24px 48px;
  color:var(--ink-3); font-size:.76rem; text-align:center;
}
footer .k{
  font-family:"IBM Plex Mono"; background:var(--surface-2);
  border:1px solid var(--line); padding:1px 6px; border-radius:5px;
}

@media (max-width:640px){
  main{grid-template-columns:1fr;}
  .snip-code pre{white-space:pre-wrap; word-break:break-word;}
}
</style>

<script>
function escHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

const KEYWORDS = 'const|let|var|type|interface|class|function|extends|implements|public|private|protected|readonly|static|abstract|new|return|void|this|import|export|from|default|as|satisfies|keyof|typeof|infer|in|is|instanceof|enum|namespace|declare|async|await|get|set|null|undefined|true|false|throw|if|else';
const BUILTIN_TYPES = 'string|number|boolean|any|unknown|never|object|symbol|bigint|Array|Promise|Record|Partial|Required|Readonly|Pick|Omit|Exclude|Extract|NonNullable|ReturnType|Parameters|InstanceType|Awaited|ConstructorParameters|Map|Set|Capitalize';

function hl(raw){
  const esc = escHtml(raw);
  const master = new RegExp(
    '(\\/\\/[^\\n]*)' +                                    // 1: comment
    "|('(?:[^'\\\\]|\\\\.)*'|\"(?:[^\"\\\\]|\\\\.)*\"|`(?:[^`\\\\]|\\\\.)*`)" + // 2: string/template
    '|\\b(' + KEYWORDS + ')\\b' +                          // 3: keyword
    '|\\b(' + BUILTIN_TYPES + ')\\b' +                     // 4: builtin type
    '|\\b(\\d+)\\b',                                       // 5: number
    'g'
  );
  return esc.replace(master, (m, cm, str, kw, bt, num) => {
    if (cm) return '<span class="cm">' + cm + '</span>';
    if (str) return '<span class="str">' + str + '</span>';
    if (kw) return '<span class="kw">' + kw + '</span>';
    if (bt) return '<span class="bt">' + bt + '</span>';
    if (num) return '<span class="num">' + num + '</span>';
    return m;
  });
}

      {code:'const b: boolean = true;', desc:'布林型別'},
      {code:'const nu: null = null;', desc:'null 型別，通常搭配聯合型別一起使用'},
      {code:'const un: undefined = undefined;', desc:'undefined 型別'},
      {code:"let a: any = 'hello';", desc:'any：關閉型別檢查，盡量避免使用'},
      {code:"let u: unknown;\nif (typeof u === 'string') {\n  u.trim();\n}", desc:'unknown：比 any 安全，使用前必須先縮小型別'},
      {code:"function fail(): never {\n  throw new Error('x');\n}", desc:'never：函式必定拋出例外或無限迴圈，不會正常返回'},
      {code:"const log = (message: string): void => {\n  console.log(message);\n};", desc:'void：函式沒有回傳值'},
    ]

      {code:"const arr2: Array<string> = ['a', 'b'];", desc:'陣列型別寫法二，與上面完全等價'},
      {code:"const tuple: [string, number] = ['id', 1];", desc:'元組：固定長度、各位置型別可以不同的陣列'},

      {code:"type UserWithRole = User & { role: string };", desc:'交集型別：必須同時滿足所有成員'},
      {code:"type ApiResponse =\n  | { type: 'success'; data: string }\n  | { type: 'error'; error: string };", desc:'判別聯合：用共同欄位區分不同變體'},

const main = document.getElementById('main');
const chipNav = document.getElementById('chip-nav');
const searchInput = document.getElementById('search');
const emptyState = document.getElementById('empty-state');
const emptyTerm = document.getElementById('empty-term');
const statLine = document.getElementById('stat-line');

let totalCount = 0;

DATA.forEach(cat=>{
  totalCount += cat.items.length;

  const chip = document.createElement('button');
  chip.className = 'chip';
  chip.textContent = cat.zh;
  chip.addEventListener('click', ()=>{
    document.getElementById('cat-'+cat.id).scrollIntoView({behavior:'smooth', block:'start'});
  });
  chipNav.appendChild(chip);

  const section = document.createElement('section');
  section.className = 'cat';
  section.id = 'cat-'+cat.id;
  section.dataset.catId = cat.id;

  const head = document.createElement('div');
  head.className = 'cat-head';
  head.innerHTML = `<span class="cat-dot"></span><h2>${cat.zh}</h2><span class="en">${cat.en}</span>`;
  section.appendChild(head);

  const list = document.createElement('div');
  list.className = 'snip-list';

  cat.items.forEach(item=>{
    const row = document.createElement('div');
    row.className = 'snip-row';
    row.dataset.search = (item.code + ' ' + item.desc).toLowerCase();

    const codeWrap = document.createElement('div');
    codeWrap.className = 'snip-code';
    codeWrap.innerHTML = `<pre>${hl(item.code)}</pre>` +
      `<button class="copy-btn" title="複製程式碼"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>`;
    const btn = codeWrap.querySelector('.copy-btn');
    btn.addEventListener('click', async ()=>{
      try{
        await navigator.clipboard.writeText(item.code);
        btn.classList.add('copied');
        setTimeout(()=>btn.classList.remove('copied'), 1200);
      }catch(e){ /* clipboard unavailable — silently ignore */ }
    });

    const desc = document.createElement('p');
    desc.className = 'snip-desc';
    desc.textContent = item.desc + (item.tag ? '' : '');
    if(item.tag){
      const tagSpan = document.createElement('span');
      tagSpan.className = 'tag ' + item.tag.type;
      tagSpan.textContent = item.tag.text;
      tagSpan.style.marginLeft = '8px';
      desc.appendChild(tagSpan);
    }

    row.appendChild(codeWrap);
    row.appendChild(desc);
    list.appendChild(row);
  });

  section.appendChild(list);
  main.appendChild(section);
});

statLine.textContent = totalCount + ' 條語法 · ' + DATA.length + ' 個分類';

searchInput.addEventListener('input', ()=>{
  const term = searchInput.value.trim().toLowerCase();
  let visibleTotal = 0;
  document.querySelectorAll('section.cat').forEach(section=>{
    let visibleInSection = 0;
    section.querySelectorAll('.snip-row').forEach(row=>{
      const match = !term || row.dataset.search.includes(term);
      row.style.display = match ? '' : 'none';
      if(match) visibleInSection++;
    });
    section.style.display = visibleInSection ? '' : 'none';
    visibleTotal += visibleInSection;
  });
  emptyState.style.display = (term && visibleTotal===0) ? 'block' : 'none';
  emptyTerm.textContent = searchInput.value.trim();
});
</script>

</body></html>
