<style>
  :root{
    --bg:#f6f3ed; --ink:#263238; --muted:#65727a; --card:#fffdf8;
    --line:#9aa7ad; --accent:#5b7083; --gold:#b08a45;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;
  }
  header{padding:28px 5vw 18px;text-align:center}
  h1{margin:0 0 8px;font-size:clamp(28px,4vw,46px);letter-spacing:.04em}
  .subtitle{color:var(--muted);font-size:15px}
  .toolbar{
    display:flex;justify-content:center;gap:10px;flex-wrap:wrap;
    padding:8px 5vw 18px
  }
  button{
    border:1px solid #c5c0b5;background:var(--card);border-radius:999px;
    padding:8px 14px;cursor:pointer;font:inherit;color:var(--ink)
  }
  button:hover{background:#eee9df}
  .canvas-wrap{
    margin:0 auto 28px;width:min(1500px,96vw);overflow:auto;
    border:1px solid #ddd6c9;border-radius:18px;background:#faf8f3;
    box-shadow:0 8px 30px rgba(55,45,30,.08)
  }
  svg{display:block;width:1600px;height:940px;min-width:1600px}
  .edge{fill:none;stroke:var(--line);stroke-width:2.5}
  .edge.major{stroke:#687a84;stroke-width:3.5}
  .node{cursor:pointer}
  .node rect{fill:var(--card);stroke:#aeb8bb;stroke-width:2;rx:12}
  .node:hover rect{stroke:var(--gold);stroke-width:3}
  .node text{fill:var(--ink);font-size:16px;font-weight:600}
  .node .small{font-size:12px;font-weight:400;fill:var(--muted)}
  .root rect{fill:#3f5665;stroke:#3f5665}
  .root text{fill:white}
  .era rect{fill:#e9e4d8;stroke:#b8ad99}
  .era text{font-size:14px}
  .legend{
    width:min(1200px,92vw);margin:0 auto 30px;padding:18px 22px;
    background:var(--card);border:1px solid #ddd6c9;border-radius:16px
  }
  .legend h2{margin:0 0 12px;font-size:20px}
  .legend-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
  .legend-item{font-size:14px;color:#4f5b61}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px;background:#b08a45}
  .note{color:var(--muted);font-size:13px;line-height:1.7;margin-top:12px}
  .popup-backdrop{display:none;position:fixed;inset:0;background:rgba(25,30,32,.38);z-index:1000;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
  .popup-backdrop.show{display:flex}
  .popup{position:relative;width:min(560px,92vw);max-height:75vh;overflow:auto;background:#fffdf8;border:1px solid #d6cdbd;border-radius:18px;box-shadow:0 18px 60px rgba(0,0,0,.24);padding:28px 30px}
  .popup h3{margin:0 35px 12px 0;font-size:24px}
  .popup p{line-height:1.9;margin:0;color:#46545a}
  .close{position:absolute;right:13px;top:10px;border:0;background:transparent;font-size:30px;line-height:1;color:#6d777c;padding:3px 8px;cursor:pointer}
  .close:hover{color:#222;background:#eee9df;border-radius:50%}
  @media(max-width:700px){
    header{padding-top:20px}
    .canvas-wrap{border-radius:10px}
  }
</style>

<section class="legend">
  <h2>如何使用這張藍圖</h2>
  <div class="legend-grid">
    <div class="legend-item">● <b>縱向</b>：按照時代理解思想如何演變。</div>
    <div class="legend-item">● <b>橫向</b>：比較同一問題在不同時代的答案。</div>
    <div class="legend-item">● <b>節點</b>：點擊哲學家或學派，可查看學習重點。</div>
    <div class="legend-item">● <b>問題軸</b>：用問題串聯不同哲學傳統。</div>
  </div>
  <div class="note">
    這是一張「學習地圖」而非完整哲學史。哲學家與學派之間存在跨時代影響、內部分歧與多重歸類；
    圖中採取教學上較容易掌握的主幹分類。
  </div>
</section>

<script>
const info = {
root:["西方哲學","建議先建立「問題意識」，再沿時代閱讀原典與導論。核心問題包括：什麼是真實？如何知道？何謂善？人如何共同生活？語言如何表達思想？"],

modern:["近代哲學","從科學革命與認識論問題出發。理性主義強調理性結構，經驗主義強調經驗來源，康德試圖重新界定兩者的關係。"],

function show(key){
  const x=info[key]||info.root;
  document.getElementById("popupTitle").textContent=x[0];
  document.getElementById("popupText").textContent=x[1];
  document.getElementById("popupBackdrop").classList.add("show");
}
function closePopup(e){
  if(e && e.target !== document.getElementById("popupBackdrop")) return;
  document.getElementById("popupBackdrop").classList.remove("show");
}
document.addEventListener("keydown",function(e){if(e.key==="Escape")document.getElementById("popupBackdrop").classList.remove("show")});
let scale=1;
function zoom(f){
  scale=Math.max(.65,Math.min(1.45,scale*f));
  document.getElementById("map").style.transform="scale("+scale+")";
  document.getElementById("map").style.transformOrigin="top left";
}
function resetZoom(){scale=1;document.getElementById("map").style.transform="scale(1)"}
</script>
